<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smile - Neon User Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#00FF88",
              cyan: "#00D4FF",
              magenta: "#FF00FF",
              red: "#FF4444",
              background: "#0D0D0D",
            },
            fontFamily: {
              display: ["Plus Jakarta Sans", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "1.25rem",
            },
          },
        },
      };
    </script>
<style type="text/tailwindcss">
      :root {
        --glass-bg: rgba(20, 20, 20, 0.7);
        --neon-green: #00FF88;
        --neon-cyan: #00D4FF;
        --neon-magenta: #FF00FF;
        --neon-red: #FF4444;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #0D0D0D;
        -webkit-tap-highlight-color: transparent;
      }
      .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .neon-border-green { border: 1px solid rgba(0, 255, 136, 0.3); box-shadow: 0 0 15px rgba(0, 255, 136, 0.15); }
      .neon-border-cyan { border: 1px solid rgba(0, 212, 255, 0.3); box-shadow: 0 0 15px rgba(0, 212, 255, 0.1); }
      .neon-border-magenta { border: 1px solid rgba(255, 0, 255, 0.3); box-shadow: 0 0 15px rgba(255, 0, 255, 0.1); }
      .neon-border-red { border: 1px solid rgba(255, 68, 68, 0.3); box-shadow: 0 0 15px rgba(255, 68, 68, 0.1); }
      .profile-glow {
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.4), inset 0 0 10px rgba(0, 255, 136, 0.2);
      }
      .fab-glow {
        box-shadow: 0 0 25px rgba(0, 255, 136, 0.6), 0 0 50px rgba(0, 255, 136, 0.2);
      }
      .logout-glow {
        text-shadow: 0 0 8px rgba(255, 68, 68, 0.6);
      }
      .custom-scrollbar::-webkit-scrollbar {
        display: none;
      }
    </style>
<style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-white min-h-screen pb-32">
<header class="px-6 pt-12 pb-8 flex items-center justify-between sticky top-0 bg-[#0D0D0D]/80 backdrop-blur-md z-50">
<h1 class="text-2xl font-extrabold tracking-tight">Profile</h1>
<button class="w-10 h-10 rounded-full flex items-center justify-center bg-zinc-900 border border-zinc-800 text-zinc-400">
<span class="material-symbols-outlined text-xl">settings</span>
</button>
</header>
<main class="px-6 space-y-8">
<section class="flex flex-col items-center">
<div class="relative">
<div class="w-32 h-32 rounded-full p-1 bg-gradient-to-tr from-primary to-cyan profile-glow">
<div class="w-full h-full rounded-full bg-zinc-900 overflow-hidden flex items-center justify-center border-2 border-black">
<span class="material-symbols-outlined text-6xl text-zinc-600">person</span>
</div>
</div>
<button class="absolute bottom-1 right-1 w-9 h-9 rounded-full bg-primary text-background flex items-center justify-center border-4 border-background">
<span class="material-symbols-outlined text-lg font-bold">edit</span>
</button>
</div>
<div class="mt-6 text-center">
<h2 class="text-2xl font-black tracking-tight">Johnathan Doe</h2>
<p class="text-zinc-500 font-bold text-xs uppercase tracking-widest mt-1">Premium Member</p>
</div>
</section>
<section class="space-y-4">
<div class="glass-card neon-border-green p-6 rounded-[2rem] flex items-center justify-between">
<div>
<p class="text-[10px] text-zinc-500 font-black uppercase tracking-widest mb-1">Email Address</p>
<p class="font-bold text-sm">john.doe@neonfinance.io</p>
</div>
<span class="material-symbols-outlined text-zinc-600">chevron_right</span>
</div>
<div class="glass-card neon-border-cyan p-6 rounded-[2rem]">
<p class="text-[10px] text-zinc-500 font-black uppercase tracking-widest mb-4">Currency Preference</p>
<div class="flex gap-3">
<button class="flex-1 py-3 px-4 rounded-2xl bg-primary text-background font-bold text-sm shadow-[0_0_15px_rgba(0,255,136,0.3)] border border-primary">
                        INR (₹)
                    </button>
<button class="flex-1 py-3 px-4 rounded-2xl bg-zinc-900/50 border border-zinc-800 text-zinc-400 font-bold text-sm">
                        USD ($)
                    </button>
<button class="flex-1 py-3 px-4 rounded-2xl bg-zinc-900/50 border border-zinc-800 text-zinc-400 font-bold text-sm">
                        EUR (€)
                    </button>
</div>
</div>
</section>
<section class="space-y-3">
<h3 class="text-[10px] text-zinc-500 font-black uppercase tracking-[0.2em] px-2">Account Management</h3>
<div class="glass-card border border-zinc-800/50 rounded-[2.5rem] divide-y divide-zinc-800/50 overflow-hidden">
<button class="w-full px-6 py-5 flex items-center justify-between text-left group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-xl bg-magenta/10 border border-magenta/20 flex items-center justify-center text-magenta">
<span class="material-symbols-outlined">account_balance_wallet</span>
</div>
<span class="font-bold">Payment Methods</span>
</div>
<span class="material-symbols-outlined text-zinc-600">chevron_right</span>
</button>
<button class="w-full px-6 py-5 flex items-center justify-between text-left group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-xl bg-cyan/10 border border-cyan/20 flex items-center justify-center text-cyan">
<span class="material-symbols-outlined">security</span>
</div>
<span class="font-bold">Security &amp; Privacy</span>
</div>
<span class="material-symbols-outlined text-zinc-600">chevron_right</span>
</button>
<button class="w-full px-6 py-5 flex items-center justify-between text-left group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-xl bg-primary/10 border border-primary/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">notifications_active</span>
</div>
<span class="font-bold">Push Notifications</span>
</div>
<span class="material-symbols-outlined text-zinc-600">chevron_right</span>
</button>
<button class="w-full px-6 py-5 flex items-center justify-between text-left group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-xl bg-zinc-800 flex items-center justify-center text-zinc-400">
<span class="material-symbols-outlined">help</span>
</div>
<span class="font-bold">Support Center</span>
</div>
<span class="material-symbols-outlined text-zinc-600">chevron_right</span>
</button>
</div>
</section>
<section class="pt-4 flex justify-center">
<button class="flex items-center gap-2 py-4 px-10 rounded-full border border-red/30 bg-red/5">
<span class="material-symbols-outlined text-red logout-glow">logout</span>
<span class="text-red font-bold uppercase tracking-widest text-sm logout-glow">Logout Account</span>
</button>
</section>
<p class="text-center text-[10px] text-zinc-600 font-medium uppercase tracking-widest pt-4">Version 2.4.0 • Neon Finance Pro</p>
</main>
<nav class="fixed bottom-0 left-0 right-0 bg-background/80 backdrop-blur-2xl border-t border-white/5 px-8 py-5 flex justify-between items-center z-[100]">
<button class="flex flex-col items-center gap-1.5 text-zinc-500">
<span class="material-symbols-outlined text-2xl">home</span>
<span class="text-[9px] font-black uppercase tracking-tighter">Home</span>
</button>
<button class="flex flex-col items-center gap-1.5 text-zinc-500">
<span class="material-symbols-outlined text-2xl">monitoring</span>
<span class="text-[9px] font-black uppercase tracking-tighter">Stats</span>
</button>
<div class="relative -top-10">
<button class="w-16 h-16 rounded-full bg-primary text-background flex items-center justify-center fab-glow ring-4 ring-background">
<span class="material-symbols-outlined text-3xl font-black">add</span>
</button>
</div>
<button class="flex flex-col items-center gap-1.5 text-zinc-500">
<span class="material-symbols-outlined text-2xl">account_balance_wallet</span>
<span class="text-[9px] font-black uppercase tracking-tighter">Wallet</span>
</button>
<button class="flex flex-col items-center gap-1.5 text-primary">
<span class="material-symbols-outlined text-2xl font-variation-fill">person</span>
<span class="text-[9px] font-black uppercase tracking-tighter">Profile</span>
</button>
</nav>

</body></html>
